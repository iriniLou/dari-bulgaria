<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дари летит в Болгарию</title>
<meta name="description" content="Игра-воспоминание для Дари: наша история, фонари и вся Болгария на одной карте">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 20'%3E%3Crect width='30' height='20' fill='%23fff'/%3E%3Crect y='6.67' width='30' height='6.67' fill='%2300966e'/%3E%3Crect y='13.33' width='30' height='6.67' fill='%23d62612'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <header class="topbar">
    <button class="brand" id="homeBtn" title="В терминал">
      <span class="brand-flag"></span><span>Дари <small>✈</small> България</span>
    </button>
    <div class="stamps-count" id="stampsCount" hidden></div>
    <div class="audio" id="audio">
      <button class="ic" id="playBtn" title="Музыка: вкл/выкл" aria-label="Музыка">▶</button>
      <button class="ic" id="muteBtn" title="Без звука" aria-label="Без звука">🔊</button>
      <input type="range" id="vol" min="0" max="100" value="45" aria-label="Громкость">
    </div>
  </header>

  <main id="view"></main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="Закрыть">✕</button>
    <button class="lb-nav lb-prev" aria-label="Назад">‹</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="lb-nav lb-next" aria-label="Вперёд">›</button>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <audio id="music" src="audio/music.mp3" loop preload="auto"></audio>

  <script src="data.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
